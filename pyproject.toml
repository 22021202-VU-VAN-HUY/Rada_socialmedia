[project]
name = "talent-radar"
version = "0.1.0"
description = "Local background social collection dashboard"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "streamlit>=1.36",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "playwright>=1.49",
  "pywinauto>=0.6.9",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "requests>=2.31",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 100

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
